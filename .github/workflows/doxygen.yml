name: Deploy Doxygen to GitHub Pages

on:
  push:
    branches: ["**"] # Triggers on a push to any branch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Documentation
        run: |
          # Since your Doxyfile is in the project root next to the code:
          doxygen Doxyfile

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Upload Static Web Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # Assumes Doxygen outputs to the default 'html' directory. 
          # If your Doxyfile has HTML_OUTPUT changed, update this path.
          path: './html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
